name: Publish

# Publish both npm packages via OIDC trusted publishing - no tokens anywhere.
# Manually triggered ONLY: Actions -> Publish -> Run workflow -> enter a version.
#
# Two-phase setup (once per package):
#   1. vue-design-lab (template/): publish locally once, then on npmjs.com ->
#      package -> Settings -> Trusted Publishers, bind this repository with
#      workflow file `publish.yml` and path `template/`.
#   2. create-vue-design-lab (repo root): same, path is the repo root.
#
# Flow: stamp BOTH package.json with the input version (lockstep) -> gates
# (package hygiene + scaffolder e2e) -> bot commit + tag v<version> -> publish
# the library first (hosts depend on it), then the CLI.
#
#   - id-token: write  -> OIDC publish + npm provenance.
#   - contents: write  -> pushes the release commit + tag.
# A tag pushed by this workflow's own GITHUB_TOKEN does NOT re-trigger
# workflows, so there is no double publish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish for BOTH packages, e.g. 0.2.0 (leading "v" optional). Bumps both package.json, commits, tags, then publishes.'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false # never interrupt a publish mid-flight

jobs:
  publish:
    name: Stamp, gate, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json `packageManager` -
      # don't pass `version` here, it conflicts and throws ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Stamp both packages in lockstep; npm version validates semver.
      - name: Stamp version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"                      # tolerate "v0.2.0"
          if [ -z "$VERSION" ]; then
            echo "::error::version input is required (e.g. 0.2.0)"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version
          (cd template && npm version "$VERSION" --no-git-tag-version)
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Test pages are git-ignored locally (.git/info/exclude) but npm packs by
      # the files allowlist, not git rules - never ship them.
      - name: Package hygiene gate
        run: |
          set -euo pipefail
          extra=$(ls -A host-template/src/pages | grep -v '^\.gitkeep$' || true)
          if [ -n "$extra" ]; then
            echo "::error::host-template/src/pages must be empty before publishing (found: $extra)"
            exit 1
          fi

      # Scaffold a host app and build it against the local library copy
      # (file: dep keeps this gate hermetic regardless of what npm carries).
      # The copy has no lockfile (package name is rewritten), so let CI
      # create one.
      - name: Scaffolder e2e
        run: |
          set -euo pipefail
          node index.mjs /tmp/lab-e2e --lab "file:${GITHUB_WORKSPACE}/template"
          cd /tmp/lab-e2e && pnpm install --no-frozen-lockfile && pnpm build

      # Runs after the gates so a broken tree is never tagged.
      - name: Commit, tag, push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git add package.json template/package.json
          git commit -m "chore(release): v${RELEASE_VERSION}"
          git tag "v${RELEASE_VERSION}"
          git push origin "HEAD:$BRANCH" "v${RELEASE_VERSION}"

      # The library first: hosts depend on it from npm. Its only build is
      # vue-tsc, run explicitly so the tarball is checked.
      - name: Publish library (vue-design-lab)
        run: |
          pnpm -C template build
          cd template && npm publish --access public --provenance

      # prepublishOnly typechecks the library, so the tarball is always fresh.
      - name: Publish CLI (create-vue-design-lab)
        run: npm publish --access public --provenance
